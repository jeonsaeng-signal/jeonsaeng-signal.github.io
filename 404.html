<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex">
<title>페이지를 찾을 수 없습니다 | 전생시그널</title><style>
:root{--gold:#C9A84C;--gold-light:#F0C96B;--bg:#16122E;--card:#211B3D;--line:#3a3166;--text:#E8DCC8;--dim:#9A8A6A;--naver:#03C75A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;line-height:1.75;word-break:keep-all}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
nav.crumb{font-size:13px;color:var(--dim);margin-bottom:14px}nav.crumb a{color:var(--gold-light);text-decoration:none}
.kicker{font-size:13px;color:var(--gold);font-weight:700;letter-spacing:.04em}
h1{font-size:24px;line-height:1.4;margin:6px 0 14px;color:#FFF6E0}
p.answer{font-size:17px;margin-bottom:10px}
p.signal{font-size:16px;color:#E2CE9E;margin-bottom:18px}
.video{position:relative;width:100%;max-width:360px;aspect-ratio:9/16;margin:6px auto 22px;border-radius:14px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
h2{font-size:18px;color:var(--gold-light);margin:26px 0 10px}
.script{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:15px}
.card{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--text)}
.card img{width:96px;height:96px;object-fit:cover;border-radius:10px;background:#fff;flex:none}
.card b{display:block;font-size:15px;line-height:1.4}.card small{color:var(--dim);font-size:12.5px}
.cta{display:block;text-align:center;margin-top:10px;padding:13px;border-radius:12px;background:var(--naver);color:#fff;font-weight:700;text-decoration:none}
.ad{font-size:12.5px;color:var(--dim);margin:8px 0}
ul.more{list-style:none}ul.more li{border-top:1px solid var(--line)}ul.more a{display:block;padding:11px 2px;color:var(--text);text-decoration:none}
ul.more span{color:var(--dim);font-size:13px}
footer{max-width:640px;margin:0 auto;padding:18px 16px 40px;font-size:12.5px;color:var(--dim);border-top:1px solid var(--line)}
footer a{color:var(--gold-light)}
</style></head>
<body><main><h1>페이지를 찾을 수 없습니다</h1><p class="answer"><a style="color:#F0C96B" href="/">전생시그널 첫 페이지로 가기</a></p></main></body></html>
